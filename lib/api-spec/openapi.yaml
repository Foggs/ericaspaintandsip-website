openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Erica's Paint & Sip API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: events
    description: Public events
  - name: bookings
    description: Event bookings
  - name: private-inquiries
    description: Private event inquiries
  - name: gallery
    description: Photo gallery
  - name: posts
    description: Blog posts
  - name: newsletter
    description: Newsletter subscribers
  - name: storage
    description: Object storage upload and serving endpoints
  - name: admin
    description: Admin-only content management endpoints (requires auth + allowlist)

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ── Events ──────────────────────────────────────────────────────────────────
  /events:
    get:
      operationId: listEvents
      tags: [events]
      summary: List all published events
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 12
        - name: upcoming
          in: query
          description: Only return future events
          schema:
            type: boolean
      responses:
        "200":
          description: Paginated list of events
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventListResponse"
    post:
      operationId: createEvent
      tags: [events]
      summary: Create a new event (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEventBody"
      responses:
        "201":
          description: Created event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden — not in admin allowlist

  /events/upcoming:
    get:
      operationId: getUpcomingEvents
      tags: [events]
      summary: Get next N upcoming events (homepage widget)
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 3
      responses:
        "200":
          description: Upcoming events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Event"

  /events/summary:
    get:
      operationId: getEventsSummary
      tags: [events]
      summary: Aggregate stats — total events, upcoming count, total bookings (admin only)
      responses:
        "200":
          description: Events summary stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventsSummary"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden — not in admin allowlist

  /events/{id}:
    get:
      operationId: getEvent
      tags: [events]
      summary: Get event by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Event detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"
        "404":
          description: Not found
    put:
      operationId: updateEvent
      tags: [events]
      summary: Update an event (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEventBody"
      responses:
        "200":
          description: Updated event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden — not in admin allowlist
    delete:
      operationId: deleteEvent
      tags: [events]
      summary: Delete an event (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "401":
          description: Unauthorized
        "403":
          description: Forbidden — not in admin allowlist

  /events/{slug}/by-slug:
    get:
      operationId: getEventBySlug
      tags: [events]
      summary: Get event by slug
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Event detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"
        "404":
          description: Not found

  # ── Bookings ─────────────────────────────────────────────────────────────────
  /bookings:
    get:
      operationId: listBookings
      tags: [bookings]
      summary: List all bookings (admin only — contains customer PII)
      parameters:
        - name: eventId
          in: query
          schema:
            type: integer
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, paid, cancelled]
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Paginated bookings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingListResponse"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden — not in admin allowlist
    post:
      operationId: createBooking
      tags: [bookings]
      summary: Create a booking (called after PayPal success)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBookingBody"
      responses:
        "201":
          description: Created booking
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"

  /bookings/{id}:
    get:
      operationId: getBooking
      tags: [bookings]
      summary: Get booking by ID (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Booking detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden — not in admin allowlist
    patch:
      operationId: updateBookingStatus
      tags: [bookings]
      summary: Update booking status (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateBookingStatusBody"
      responses:
        "200":
          description: Updated booking
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden — not in admin allowlist

  # ── Private Inquiries ────────────────────────────────────────────────────────
  /private-inquiries:
    get:
      operationId: listPrivateInquiries
      tags: [private-inquiries]
      summary: List all private event inquiries (admin only — contains customer PII)
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Paginated inquiries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrivateInquiryListResponse"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden — not in admin allowlist
    post:
      operationId: createPrivateInquiry
      tags: [private-inquiries]
      summary: Submit a private event inquiry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePrivateInquiryBody"
      responses:
        "201":
          description: Created inquiry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrivateInquiry"

  /private-inquiries/{id}:
    get:
      operationId: getPrivateInquiry
      tags: [private-inquiries]
      summary: Get inquiry by ID (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Inquiry detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrivateInquiry"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden — not in admin allowlist
    delete:
      operationId: deletePrivateInquiry
      tags: [private-inquiries]
      summary: Delete an inquiry (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "401":
          description: Unauthorized
        "403":
          description: Forbidden — not in admin allowlist

  # ── Gallery ──────────────────────────────────────────────────────────────────
  /gallery:
    get:
      operationId: listGalleryPhotos
      tags: [gallery]
      summary: List gallery photos
      parameters:
        - name: category
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 24
      responses:
        "200":
          description: Paginated gallery photos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GalleryPhotoListResponse"
    post:
      operationId: createGalleryPhoto
      tags: [gallery]
      summary: Add a gallery photo (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGalleryPhotoBody"
      responses:
        "201":
          description: Created photo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GalleryPhoto"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden — not in admin allowlist

  /gallery/featured:
    get:
      operationId: getFeaturedGalleryPhotos
      tags: [gallery]
      summary: Get featured photos for the homepage (top by sortOrder)
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 6
      responses:
        "200":
          description: Featured photos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GalleryPhoto"

  /gallery/categories:
    get:
      operationId: getGalleryCategories
      tags: [gallery]
      summary: List distinct gallery categories
      responses:
        "200":
          description: Category list
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string

  /gallery/{id}:
    get:
      operationId: getGalleryPhoto
      tags: [gallery]
      summary: Get gallery photo by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Gallery photo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GalleryPhoto"
    put:
      operationId: updateGalleryPhoto
      tags: [gallery]
      summary: Update a gallery photo (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGalleryPhotoBody"
      responses:
        "200":
          description: Updated photo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GalleryPhoto"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden — not in admin allowlist
    delete:
      operationId: deleteGalleryPhoto
      tags: [gallery]
      summary: Delete a gallery photo (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "401":
          description: Unauthorized
        "403":
          description: Forbidden — not in admin allowlist

  # ── Blog Posts ───────────────────────────────────────────────────────────────
  /posts:
    get:
      operationId: listPosts
      tags: [posts]
      summary: List published blog posts
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
      responses:
        "200":
          description: Paginated posts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostListResponse"
    post:
      operationId: createPost
      tags: [posts]
      summary: Create a blog post (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePostBody"
      responses:
        "201":
          description: Created post
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden — not in admin allowlist

  /posts/recent:
    get:
      operationId: getRecentPosts
      tags: [posts]
      summary: Get most recent posts for homepage
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 3
      responses:
        "200":
          description: Recent posts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Post"

  /posts/{id}:
    get:
      operationId: getPost
      tags: [posts]
      summary: Get post by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Post detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
    put:
      operationId: updatePost
      tags: [posts]
      summary: Update a blog post (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePostBody"
      responses:
        "200":
          description: Updated post
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden — not in admin allowlist
    delete:
      operationId: deletePost
      tags: [posts]
      summary: Delete a post (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "401":
          description: Unauthorized
        "403":
          description: Forbidden — not in admin allowlist

  /posts/{slug}/by-slug:
    get:
      operationId: getPostBySlug
      tags: [posts]
      summary: Get post by slug
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Post detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
        "404":
          description: Not found

  # ── Storage ──────────────────────────────────────────────────────────────────
  /storage/uploads/request-url:
    post:
      tags: [storage]
      operationId: requestUploadUrl
      summary: Request a presigned URL for file upload
      description: |
        Returns a presigned GCS URL for direct upload. The client sends JSON
        metadata here, then uploads the file directly to the returned URL.
        Requires admin authentication.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadUrlRequest'
      responses:
        '200':
          description: Presigned upload URL generated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadUrlResponse'
        '400':
          description: Missing or invalid required fields
        '401':
          description: Unauthorized
        '500':
          description: Failed to generate upload URL

  /storage/objects/{objectPath}:
    get:
      tags: [storage]
      operationId: getStorageObject
      summary: Serve an uploaded object by its path
      parameters:
        - name: objectPath
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Object content streamed
          content:
            '*/*':
              schema:
                type: string
                format: binary
        '404':
          description: Object not found

  # ── Admin ─────────────────────────────────────────────────────────────────────
  /admin/me:
    get:
      tags: [admin]
      operationId: getAdminMe
      summary: Returns the signed-in user's Clerk ID (any authenticated user — no admin allowlist required; used for initial ADMIN_USER_IDS setup)
      responses:
        '200':
          description: Admin user info
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminMe'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden

  /admin/events/{id}:
    get:
      tags: [admin]
      operationId: getAdminEvent
      summary: Get a single event by ID regardless of published status (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Event record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not found

  /admin/posts/{id}:
    get:
      tags: [admin]
      operationId: getAdminPost
      summary: Get a single post by ID regardless of published status (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Post record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not found

  /admin/events:
    get:
      tags: [admin]
      operationId: listAdminEvents
      summary: List all events including unpublished (admin only)
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
      responses:
        '200':
          description: All events
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventListResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden

  /admin/posts:
    get:
      tags: [admin]
      operationId: listAdminPosts
      summary: List all posts including unpublished (admin only)
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
      responses:
        '200':
          description: All posts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostListResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden

  # ── Newsletter ───────────────────────────────────────────────────────────────
  /newsletter/subscribe:
    post:
      operationId: subscribeNewsletter
      tags: [newsletter]
      summary: Subscribe to the newsletter
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubscribeNewsletterBody"
      responses:
        "201":
          description: Subscribed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewsletterSubscriber"
        "409":
          description: Email already subscribed

  /newsletter/subscribers:
    get:
      operationId: listNewsletterSubscribers
      tags: [newsletter]
      summary: List newsletter subscribers (admin only — subscriber PII)
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
      responses:
        "200":
          description: Paginated subscribers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewsletterSubscriberListResponse"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden — not in admin allowlist

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    # ── Pagination ─────────────────────────────────────────────────────────────
    PaginationMeta:
      type: object
      properties:
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
        totalPages:
          type: integer
      required: [page, limit, total, totalPages]

    # ── Event ──────────────────────────────────────────────────────────────────
    Event:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        slug:
          type: string
        date:
          type: string
          format: date-time
        durationMinutes:
          type: integer
          nullable: true
        location:
          type: string
          nullable: true
        price:
          type: number
          nullable: true
        capacity:
          type: integer
          nullable: true
        seatsAvailable:
          type: integer
          nullable: true
        description:
          type: string
          nullable: true
        coverImageUrl:
          type: string
          nullable: true
        isPublished:
          type: boolean
        createdAt:
          type: string
          format: date-time
      required: [id, title, slug, date, isPublished, createdAt]

    CreateEventBody:
      type: object
      properties:
        title:
          type: string
        date:
          type: string
          format: date-time
        durationMinutes:
          type: integer
          nullable: true
        location:
          type: string
          nullable: true
        price:
          type: number
          nullable: true
        capacity:
          type: integer
          nullable: true
        description:
          type: string
          nullable: true
        coverImageUrl:
          type: string
          nullable: true
        isPublished:
          type: boolean
          default: false
      required: [title, date]

    EventListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Event"
        meta:
          $ref: "#/components/schemas/PaginationMeta"
      required: [data, meta]

    EventsSummary:
      type: object
      properties:
        totalEvents:
          type: integer
        upcomingEvents:
          type: integer
        totalBookings:
          type: integer
        totalRevenue:
          type: number
      required: [totalEvents, upcomingEvents, totalBookings, totalRevenue]

    # ── Booking ────────────────────────────────────────────────────────────────
    Booking:
      type: object
      properties:
        id:
          type: integer
        eventId:
          type: integer
        name:
          type: string
        email:
          type: string
        phone:
          type: string
          nullable: true
        seats:
          type: integer
        paypalOrderId:
          type: string
          nullable: true
        status:
          type: string
          enum: [pending, paid, cancelled]
        createdAt:
          type: string
          format: date-time
      required: [id, eventId, name, email, seats, status, createdAt]

    CreateBookingBody:
      type: object
      properties:
        eventId:
          type: integer
        name:
          type: string
        email:
          type: string
        phone:
          type: string
          nullable: true
        seats:
          type: integer
        paypalOrderId:
          type: string
          nullable: true
        status:
          type: string
          enum: [pending, paid, cancelled]
          default: pending
      required: [eventId, name, email, seats]

    UpdateBookingStatusBody:
      type: object
      properties:
        status:
          type: string
          enum: [pending, paid, cancelled]
      required: [status]

    BookingListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Booking"
        meta:
          $ref: "#/components/schemas/PaginationMeta"
      required: [data, meta]

    # ── Private Inquiry ────────────────────────────────────────────────────────
    PrivateInquiry:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        phone:
          type: string
        preferredDate:
          type: string
          format: date
          nullable: true
