    CreateGalleryPhotoBody:
      type: object
      properties:
        imageUrl:
          type: string
        caption:
          type: string
          nullable: true
        category:
          type: string
          nullable: true
        sortOrder:
          type: integer
          nullable: true
      required: [imageUrl]

    GalleryPhotoListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/GalleryPhoto"
        meta:
          $ref: "#/components/schemas/PaginationMeta"
      required: [data, meta]

    # ── Post ───────────────────────────────────────────────────────────────────
    Post:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        slug:
          type: string
        publishedDate:
          type: string
          format: date
          nullable: true
        excerpt:
          type: string
          nullable: true
        content:
          type: string
          nullable: true
        coverImageUrl:
          type: string
          nullable: true
        isPublished:
          type: boolean
        createdAt:
          type: string
          format: date-time
      required: [id, title, slug, isPublished, createdAt]

    CreatePostBody:
      type: object
      properties:
        title:
          type: string
        publishedDate:
          type: string
          format: date
          nullable: true
        excerpt:
          type: string
          nullable: true
        content:
          type: string
          nullable: true
        coverImageUrl:
          type: string
          nullable: true
        isPublished:
          type: boolean
          default: false
      required: [title]

    PostListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Post"
        meta:
          $ref: "#/components/schemas/PaginationMeta"
      required: [data, meta]

    # ── Storage ────────────────────────────────────────────────────────────────
    UploadUrlRequest:
      type: object
      required: [name, size, contentType]
      properties:
        name:
          type: string
          minLength: 1
          description: Original file name
        size:
          type: integer
          minimum: 1
          description: File size in bytes
        contentType:
          type: string
          minLength: 1
          description: MIME type (e.g. image/jpeg)

    UploadUrlResponse:
      type: object
      required: [uploadURL, objectPath]
      properties:
        uploadURL:
          type: string
          format: uri
          description: Presigned GCS URL for PUT upload
        objectPath:
          type: string
          description: Normalized object path (e.g. /objects/uploads/uuid). Store in DB.
        metadata:
          $ref: '#/components/schemas/UploadUrlRequest'

    # ── Admin ──────────────────────────────────────────────────────────────────
    AdminMe:
      type: object
      required: [userId]
      properties:
        userId:
          type: string

